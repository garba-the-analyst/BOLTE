# Render Blueprint: static site published from the generated bundle.
services:
  - type: web
    runtime: static
    name: bolte-website
    buildCommand: python3 build-scripts/generate-pages.py website "$RENDER_EXTERNAL_URL" && bash build-scripts/package-pages.sh
    staticPublishPath: ./_pages
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /404.html
