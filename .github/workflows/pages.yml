name: Deploy website to Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "assets/logo-placeholder/**"
      - "assets/animations/**"
      - "assets/logos/**"
      - "forms/**"
      - "website/assets/hfp/**"
      - ".github/workflows/pages.yml"
      - "build-scripts/package-pages.sh"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Package site bundle
        run: ./build-scripts/package-pages.sh _pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages
      - id: deployment
        uses: actions/deploy-pages@v4
